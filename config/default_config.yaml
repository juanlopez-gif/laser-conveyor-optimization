# =============================================================================
# Laser + conveyors simulator — DEFAULT CONFIGURATION (single source of truth)
# =============================================================================
# Units: distances in cm, times in s, speeds in cm/s.
# Every numeric parameter of the system lives HERE. Other config files (e.g.
# config/examples/*.yaml) only need to list the keys they override; they are
# deep-merged on top of this file. CLI overrides: --set laser.speed_x=8
# =============================================================================

simulation:
  seed: 42                     # master seed -> every random stream derives from it
  dt: 0.01                     # integration time step [s] (see docs/assumptions.md)
  arrival_horizon: 300.0       # no new parts are generated after this time [s]
  drain: true                  # after the horizon keep simulating until the system is empty
  max_time: 3600.0             # hard stop [s] (safety net)
  trace_interval: 0.1          # visualization / queue sampling period [s]
  min_part_spacing: 4.0        # min distance between consecutive parts on a belt [cm]
  # What happens when an UNPROCESSED part reaches the end of the laser zone:
  #   block -> its conveyor stops until the laser processes it (CONFIRMED for the real cell)
  #   pass  -> the part keeps going and leaves the system unprocessed ("missed")
  unprocessed_at_zone_end: block
  # Which conveyors stop while the laser processes a part:
  #   processing_conveyor_only -> only the conveyor carrying the part (default)
  #   all_conveyors            -> every conveyor stops
  conveyor_stop_policy: processing_conveyor_only
  due_date_allowance: 20.0     # due date = arrival_time + allowance [s] (for lateness)
  # Information model (0.7.3): which parts a POLICY may observe (physics unchanged).
  #   belts -> every part on the belts (entry zone + laser zone) with its position.
  #            REAL CELL: an overhead camera sees all belts and their working area.
  #   zone  -> only parts inside the laser zone (what-if: no camera)
  #   full  -> also parts waiting upstream of the belt entry (what-if upper bound;
  #            behaviour of every version before 0.7.3)
  #   auto  -> belts
  observation: auto
  # Visible length (0.7.10): how many cm of the ENTRY zone, upstream of the laser
  # zone, the camera sees at level belts (the stretch [a - visible_length, a)).
  #   null -> the whole entry zone (geometry.entry_length; the design camera)
  #   0    -> parts are seen only from the laser zone on (belts behaves like zone)
  # A part upstream of the visible stretch is neither observed nor a pre-positioning
  # candidate. Ignored by zone and full. Treatment-B parameter of docs/plans/papers.md.
  visible_length: null

geometry:
  entry_length: 10.0           # entry zone   (laser cannot reach)
  active_length: 35.0          # laser zone   (laser can reach)
  exit_length: 10.0            # exit zone    (laser cannot reach)

conveyors:
  count: 3                     # N conveyors. Change this + the lists below.
  y_positions: [0.0, 12.0, 24.0]   # if null -> y_i = i * spacing
  spacing: 12.0
  speed: 3.0                   # scalar (all conveyors) or list with one value per conveyor

laser:
  speed_x: 10.0
  speed_y: 10.0
  # simultaneous: both axes move at the same time -> t = max(dx/vx, dy/vy)
  # sequential:   X first, then Y               -> t = dx/vx + dy/vy
  motion_model: simultaneous
  workspace:                   # null -> derived: X = laser zone, Y = [min y, max y] of conveyors
    x_min: null
    x_max: null
    y_min: null
    y_max: null
  home: {x: null, y: null}     # initial position; null -> centre of the workspace
  # Pre-positioning: may the laser be sent to a part that is still in the ENTRY zone
  # (it moves to the meeting point at x >= a and waits there)?
  #   none      -> only parts already inside the laser zone are dispatched (restricted
  #                model P^sim = P + (C7); behaviour of versions <= 0.3)
  #   when_idle -> entry-zone parts are candidates only when NO part is READY; if a
  #                part becomes READY while the laser waits, the pre-positioning is
  #                revoked and the policy decides again
  #   always    -> entry-zone parts are always candidates (model P; decoder of P)
  # Physically this requires knowing that a part is on the entry zone. The planned
  # cell has an overhead camera that sees the entry zone (simulation.observation:
  # belts), so the information exists; DESIGN DECISION 2026-11-22 (0.7.7): the cell
  # runs when_idle. none is kept as the variant without entry detection.
  # See docs/CHANGELOG.md (0.4.0, 0.7.7), docs/assumptions.md C4, formal_formulation.md §1.5.
  prepositioning: when_idle

arrivals:
  mode: deterministic          # deterministic | stochastic | explicit
  deterministic:
    intervals: [10.0, 12.0, 14.0]  # one per conveyor (or a scalar)
    first_arrival: [0.0, 1.0, 2.0] # offset of the first part per conveyor
  stochastic:
    # exponential -> Poisson arrivals (exponential inter-arrival times)
    # burst       -> on/off Poisson source with the SAME mean rate (0.7.10): parts
    #                arrive only while the source is on; see simulation/arrivals.py
    distribution: exponential
    mean_interarrival: [10.0, 12.0, 14.0]
    burst:                           # used by distribution: burst only
      on_fraction: 1.0               # fraction of time the source is on (1 = Poisson)
      on_mean: 20.0                  # mean length of an on-period [s]
  explicit: []                     # list of {time, conveyor, processing_time} (tests / static instances)

processing:
  distribution: constant       # constant | uniform | normal
  time: 2.5                    # used by "constant"
  uniform: {low: 1.5, high: 3.5}
  normal: {mean: 2.5, std: 0.5, min: 0.5}

policy:
  name: nearest_job            # fifo | nearest_job | nearest_head | round_robin | weighted_score | rollout | ...
  params:
    weighted_score:
      w_wait: 1.0              # + waiting time [s]
      w_travel: 1.0            # - estimated laser travel time [s]
      w_urgency: 10.0          # + urgency in (0, 1]  (1 = part at the end of the laser zone)

objective:                     # composite objective (minimise) — see src/optimization/
  # Blocking penalty Pi = per_event * N_B + per_second * T_B  [s-equivalent], where
  #   N_B = number of parts that reached the end of the laser zone unprocessed
  #         (each one stopped its whole conveyor), and
  #   T_B = total conveyor time stopped by blocking [conveyor-s].
  # The values are PLACEHOLDERS until the real cost of a blocked conveyor is known
  # (docs/formal_formulation.md §1.4, docs/CHANGELOG.md 0.4.0).
  blocking_penalty:
    per_event: 10.0            # lambda_N [s per blocking event]
    per_second: 1.0            # lambda_T [s per conveyor-second blocked]
  weights:
    penalized_flow_time: 1.0   # mean flow time + Pi / n   (default since 0.4.0; was makespan)
    makespan: 0.0
    total_laser_travel: 0.0
    total_conveyor_stop_time: 0.0
    avg_waiting_time: 0.0

output:
  results_dir: results
  save_trace: true                 # trace.json for the visualization
  update_visualization_data: true  # also write visualization/data/trace.js
